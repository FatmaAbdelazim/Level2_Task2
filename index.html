    <!-- 
       ## Bonus: Difference Between `onclick` and `addEventListener()`

       `onclick` attaches a single click event directly in the HTML element or through JavaScript.
        If another `onclick` is assigned, it replaces the previous one.

       `addEventListener()` attaches events using JavaScript only 
        and allows multiple event listeners to be added to the same element without overwriting existing ones.
        It also keeps the HTML and JavaScript separated, making the code cleaner, easier to maintain, 
        and the preferred approach in modern JavaScript.
    -->
